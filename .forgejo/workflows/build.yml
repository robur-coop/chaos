name: Build
on: [push]
jobs:
  build:
    runs-on: ["medium", "debian-13-x86_64"]
    steps:
      - name: Install opam
        run: DEBIAN_FRONTEND=noninteractive sudo -E apt install --yes opam
      - name: Setup opam
        run: opam init -a --comp=5.4.0
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin
        run: opam pin add -yn .
      - name: Install
        run: opam install -t chaos --verbose-on=chaos
      - name: Check chaos.hvt
        run: file $(opam var bin/chaos.hvt
      - name: Run tests
        run: opam exec -- dune runtest -p chaos
